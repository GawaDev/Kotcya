services:
  - type: web
    name: kotcya
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: KOTCYA_PUBLIC_ORIGIN
        value: https://kotcya.onrender.com
